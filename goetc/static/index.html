<!doctype html>
<html>
<head>
    <title>Goettingen Exposure Time Calculator</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
</head>

<body>

<div class="container" id="app">
    <h3>Göttingen Exposure Time Calculator</h3>

    <form>
        <hr/>
        <div class="row">
            <div class="col-5">Target:</div>
            <div class="col-2"><label for="target_template">Template:</label></div>
            <div class="col-5">
                <select id="target_template" class="form-control" v-model="target.template">
                    <option v-for="option in config.templates" v-bind:value="option">{{ option }}</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-5">&nbsp;</div>
            <div class="col-2"><label>Brightness:</label></div>
            <div class="col-5">
                <div class="input-group">
                    <input type="number" class="form-control" v-model="target.mag">
                    <span class="input-group-text">mag</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-5">&nbsp;</div>
            <div class="col-2"><label for="targetBandpass">Bandpass:</label></div>
            <div class="col-5">
                <select id="targetBandpass" class="form-control" v-model="target.bandpass">
                    <option v-for="option in config.bandpasses" v-bind:value="option">{{ option }}</option>
                </select>
            </div>
        </div>

        <hr/>

        <div class="row">
            <div class="col-5">Sky:</div>
            <div class="col-2"><label>Brightness:</label></div>
            <div class="col-5">
                <div class="input-group">
                    <input type="number" class="form-control" v-model="sky.mag">
                    <span class="input-group-text">mag/sqr-arcsec</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-5">&nbsp;</div>
            <div class="col-2"><label>Seeing:</label></div>
            <div class="col-5">
                <div class="input-group">
                    <input type="number" class="form-control" v-model="sky.seeing">
                    <span class="input-group-text">arcsec</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-5">&nbsp;</div>
            <div class="col-2"><label>Airmass:</label></div>
            <div class="col-5"><input type="number" class="form-control" v-model="sky.airmass"></div>
        </div>
        <div class="row">
            <div class="col-5">&nbsp;</div>
            <div class="col-2"><label>Extinction:</label></div>
            <div class="col-5">
                <div class="input-group">
                    <input type="number" class="form-control" v-model="sky.extinction">
                    <span class="input-group-text">mag/airmass</span>
                </div>
            </div>
        </div>

        <hr/>

        <div class="row">
            <div class="col-2"><label for="telescopePreset">Telescope:</label></div>
            <div class="col-2">
                <select id="telescopePreset" class="form-control" v-model="telescope.preset">
                    <option v-for="option in config.telescopes" v-bind:value="option">{{ option }}</option>
                </select>
            </div>
            <div class="col-1"><label>&nbsp;</label></div>
            <div class="col-2"><label>Aperture:</label></div>
            <div class="col-5">
                <div class="input-group">
                    <input type="text" class="form-control" v-model="telescope.aperture">
                    <span class="input-group-text">m</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-5">&nbsp;</div>
            <div class="col-2"><label>Focal length:</label></div>
            <div class="col-5">
                <div class="input-group">
                    <input type="text" class="form-control" v-model="telescope.focal_length">
                    <span class="input-group-text">mm</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-5">&nbsp;</div>
            <div class="col-2"><label>Reflectivity:</label></div>
            <div class="col-5">
                <input type="text" class="form-control" v-model="telescope.reflectivity">
            </div>
        </div>
        <div class="row">
            <div class="col-5">&nbsp;</div>
            <div class="col-2"><label>Obscuration:</label></div>
            <div class="col-5">
                <input type="text" class="form-control" v-model="telescope.obscuration">
            </div>
        </div>

        <hr/>

        <div class="row">
            <div class="col-2"><label for="cameraPreset">Camera:</label></div>
            <div class="col-2">
                <select id="cameraPreset" class="form-control" v-model="camera.preset">
                    <option v-for="option in config.cameras" v-bind:value="option">{{ option }}</option>
                </select>
            </div>
            <div class="col-1"><label>&nbsp;</label></div>
            <div class="col-2"><label>Pixel size:</label></div>
            <div class="col-5">
                <div class="input-group">
                    <input type="text" class="form-control" v-model="camera.pixel_size">
                    <span class="input-group-text">micron (unbinned)</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-1">&nbsp;</div>
            <div class="col-1"><label>Binning:</label></div>
            <div class="col-2">
                <select class="form-control" v-model="camera.binning">
                    <option value="1">1x1</option>
                    <option value="2">2x2</option>
                    <option value="3">3x3</option>
                </select>
            </div>
            <div class="col-1"><label>&nbsp;</label></div>
            <div class="col-2"><label>RON:</label></div>
            <div class="col-5">
                <div class="input-group">
                    <input type="text" class="form-control" v-model="camera.readout_noise">
                    <span class="input-group-text">ADU</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-5">&nbsp;</div>
            <div class="col-2"><label>Dark:</label></div>
            <div class="col-5">
                <div class="input-group">
                    <input type="text" class="form-control" v-model="camera.dark_current">
                    <span class="input-group-text">ADU/px/s</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-5">&nbsp;</div>
            <div class="col-2"><label>Gain:</label></div>
            <div class="col-5">
                <div class="input-group">
                    <input type="text" class="form-control" v-model="camera.gain">
                    <span class="input-group-text">e-/ADU</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-5">&nbsp;</div>
            <div class="col-2"><label>Bias:</label></div>
            <div class="col-5">
                <div class="input-group">
                    <input type="text" class="form-control" v-model="camera.bias">
                    <span class="input-group-text">ADU</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-5">&nbsp;</div>
            <div class="col-2"><label for="qe">QE:</label></div>
            <div class="col-5">
                <select id="qe" class="form-control" v-model="camera.qe">
                    <option v-for="option in config.qes" v-bind:value="option">{{ option }}</option>
                </select>
            </div>
        </div>

        <hr/>

        <div class="row">
            <div class="col-5">Simulation:</div>
            <div class="col-2"><label for="sim_bandpass">Bandpass:</label></div>
            <div class="col-5">
                <select id="sim_bandpass" class="form-control" v-model="simulation.bandpass">
                    <option v-for="option in config.bandpasses" v-bind:value="option">{{ option }}</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-5">&nbsp;</div>
            <div class="col-2"><label>Aperture:</label></div>
            <div class="col-5">
                <div class="input-group">
                    <input type="text" class="form-control" v-model="simulation.aperture">
                    <span class="input-group-text">arcsec</span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-5">&nbsp;</div>
            <div class="col-2"><label>Exp. time:</label></div>
            <div class="col-5">
                <div class="input-group">
                    <input type="text" class="form-control" v-model="simulation.exp_time">
                    <span class="input-group-text">sec</span>
                </div>
            </div>
        </div>

        <hr/>

        <div class="text-center">
            <button class="btn btn-success">Calculate S/N</button>
        </div>

        <hr/>

        <div class="row">
            <div class="col-5">Results:</div>
            <div class="col-2"><label>Total target:</label></div>
            <div class="col-5">
                <div class="input-group">
                    <input type="text" class="form-control">
                    <span class="input-group-text">ADU</span>
                    <input type="text" class="form-control">
                    <span class="input-group-text">e-</span>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
<script src="/static/js/vue.min.js"></script>
<script src="/static/js/axios.min.js"></script>
<script src="/static/js/app.js"></script>
</html>
